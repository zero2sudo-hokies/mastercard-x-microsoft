name: Check and deploy to Azure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build live frontend
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_USE_MOCK: "0"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_API_BASE: ${{ vars.NAVIGATOR_API_BASE }}
        run: |
          test -n "$NEXT_PUBLIC_API_BASE"
          npm run build
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: frontend
          path: frontend/out
          if-no-files-found: error
          retention-days: 3

  backend:
    name: Check backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - name: Package backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('backend.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in Path('backend/app').rglob('*'):
                  if path.is_file() and '__pycache__' not in path.parts:
                      archive.write(path, path.relative_to('backend'))
              archive.write('backend/requirements.txt', 'requirements.txt')
              archive.write('data/p3/roi-inputs.json', 'data/p3/roi-inputs.json')
          PY
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: backend
          path: backend.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy live site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend
          path: deployment
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: frontend/out
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy backend
        run: |
          az webapp deploy --resource-group navigator-rg --name navigator-api-f801edf9 \
            --src-path deployment/backend.zip --type zip --track-status true --output none
      - name: Check backend health
        env:
          API_BASE: ${{ vars.NAVIGATOR_API_BASE }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 \
            --max-time 30 "$API_BASE/api/health" --output health.json
          python - <<'PY'
          import json
          with open('health.json') as response:
              health = json.load(response)
          assert health['status'] == 'ok', health
          assert health['ai_configured'], 'Foundry configuration is missing'
          PY
      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/out
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Check live website
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 \
            --max-time 30 https://ashy-desert-0ad29150f.3.azurestaticapps.net/ --output /dev/null
