# Builds the Next.js frontend as a static site and publishes it to GitHub Pages.
# Repo variable NAVIGATOR_API_BASE = public URL of the hosted backend (no trailing slash).
# If it is empty, the site is built in mock mode (static sample data, no live AI).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skipped until Pages is turned on: set repo variable NAVIGATOR_PAGES=on (or run it by hand).
    if: vars.NAVIGATOR_PAGES == 'on' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_BASE: ${{ vars.NAVIGATOR_API_BASE }}
          NEXT_PUBLIC_USE_MOCK: ${{ vars.NAVIGATOR_API_BASE == '' && '1' || '0' }}
        run: npm run build && touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
